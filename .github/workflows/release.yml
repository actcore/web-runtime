name: Publish to npm

# Publishes @actcore/web-runtime to npmjs.com on a version tag (e.g. 0.1.0).
#
# Auth uses npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN secret.
# One-time setup:
#   1. Create a GitHub Actions environment named `npm` on the actcore/web-runtime
#      repo (Settings → Environments); add protection rules there if desired.
#   2. On npmjs.com, on the @actcore/web-runtime package (or the @actcore org,
#      pre-creating the package), add a Trusted Publisher pointing at
#        repository:  actcore/web-runtime
#        workflow:    .github/workflows/release.yml
#        environment: npm
# Provenance is attested automatically (id-token: write + publishConfig.provenance).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1 (required for OIDC Trusted Publishing)
          # as a complete install — avoids the `npm i -g npm@latest` global-upgrade
          # bug where provenance's `sigstore` dep goes missing.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # wit/deps is gitignored and fetched via wkg (pinned by wkg.lock);
      # gen-types needs it present before tsc.
      - name: Install wkg
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v0.15.1/wkg-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/wkg"
          chmod +x "$RUNNER_TEMP/wkg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # wkg pulls WIT from ghcr.io
        run: |
          npm ci
          npm run sync-wit
          npm run build
          npm test

      # publishConfig in package.json sets access=public + provenance=true.
      - name: Publish
        run: npm publish
